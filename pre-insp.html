.rapport-badge.ok { background: var(--green); color: #fff; }

function renderIcoon(sleutel, size) {

  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +

// Foto's nemen via <input capture="environment"> opent de native camera-app,
// wat de mobiele browser-tab op de achtergrond zet -- Android/iOS kunnen die
// tab dan uit het geheugen gooien en herladen zodra je terugkeert, waardoor
// alle in-memory voortgang (gebruiker/voertuig/resultaten) verloren ging en
// het leek alsof "de app herstartte". Oplossing: voortgang doorlopend in
// localStorage bewaren en bij het laden automatisch herstellen i.p.v. enkel
// inloggen te tonen.
var VOORTGANG_KEY = 'prevx_inspectie_voortgang';

function slaVoortgangOp() {
  if (!gebruiker || !voertuig) return;
  try {
    localStorage.setItem(VOORTGANG_KEY, JSON.stringify({
      gebruiker: gebruiker,
      voertuig: voertuig,
      resultaten: resultaten,
      gestartOp: gestartOp,
      opgeslagenOp: Date.now()
    }));
  } catch (e) {}
}

function wisVoortgang() {
  try { localStorage.removeItem(VOORTGANG_KEY); } catch (e) {}
}

function herstelVoortgangIndienMogelijk() {
  var ruw;
  try { ruw = localStorage.getItem(VOORTGANG_KEY); } catch (e) { return; }
  if (!ruw) return;
  var opgeslagen;
  try { opgeslagen = JSON.parse(ruw); } catch (e) { wisVoortgang(); return; }
  // Enkel hetzelfde etmaal herstellen -- een weken oude, vergeten sessie
  // moet niet plots weer opduiken.
  if (!opgeslagen || !opgeslagen.opgeslagenOp || Date.now() - opgeslagen.opgeslagenOp > 12 * 60 * 60 * 1000) {
    wisVoortgang();
    return;
  }
  gebruiker = opgeslagen.gebruiker;
  voertuig = opgeslagen.voertuig;
  gestartOp = opgeslagen.gestartOp || new Date().toISOString();
  showScreen('inspectie');
  document.getElementById('headerUser2').innerHTML = '<strong>' + voertuig.nummerplaat + '</strong>' + gebruiker.naam;
  document.getElementById('btnTerug').onclick = stapTerug;
  document.getElementById('btnVolgende').style.display = '';

  sb.rpc('rpc_checklist', { p_gebruiker_id: gebruiker.id, p_voertuig_id: voertuig.id })
    .then(function(result) {
      var rijen = result.data || [];
      if (!rijen.length) { wisVoortgang(); showScreen('login'); return; }
      var bySectie = {};
      var volgorde = [];
      rijen.forEach(function(r) {
        if (!bySectie[r.sectie_id]) {
          bySectie[r.sectie_id] = { id: r.sectie_id, naam: r.sectie_naam, icon: r.sectie_icon, volgorde: r.sectie_volgorde, inspectie_punten: [] };
          volgorde.push(r.sectie_id);
        }
        bySectie[r.sectie_id].inspectie_punten.push({ id: r.punt_id, omschrijving: r.punt_omschrijving, volgorde: r.punt_volgorde, niveau: r.punt_niveau });
      });
      secties = volgorde.map(function(id) { return bySectie[id]; });
      var hersteld = opgeslagen.resultaten || {};
      resultaten = {};
      secties.forEach(function(s) {
        s.inspectie_punten.forEach(function(p) {
          resultaten[p.id] = hersteld[p.id] || { status: null, opmerking: '', fotos: [], niveau: p.niveau };
        });
      });
      bouwTabs();
      // Spring naar de eerste sectie met nog een onbeantwoorde vraag, i.p.v.
      // altijd terug bij sectie 1 te beginnen -- anders moet je na elk
      // ongewenst herstart weer helemaal naar beneden scrollen naar waar je was.
      var hervatIdx = secties.length - 1;
      for (var i = 0; i < secties.length; i++) {
        var onvolledig = secties[i].inspectie_punten.some(function(p) { return !resultaten[p.id].status; });
        if (onvolledig) { hervatIdx = i; break; }
      }
      toonSectie(hervatIdx);
      showToast('Vorige inspectie hersteld — verdergegaan waar je was.');
    })
    .catch(function() { wisVoortgang(); showScreen('login'); });
}

var VOERTUIG_ICONS = {
  'Vrachtwagen': '&#x1F69B;',
  'Bestelwagen': '&#x1F690;',
  'Heftruck': '&#x1F3D7;',
  'Aanhangwagen': '&#x1F68C;'
};

function doPinPress(c) {
  if (pin.length >= 4) return;
  pin += c;
  updatePinDisplay();
  if (pin.length === 4) doPinLogin();
}

function doPinDel() {
  pin = pin.slice(0, -1);
  updatePinDisplay();
}

function updatePinDisplay() {
  for (var i = 0; i < 4; i++) {
    var dot = document.getElementById('d' + i);
    if (i < pin.length) {
      dot.classList.add('filled');
    } else {
      dot.classList.remove('filled');
    }
  }
}

function doPinLogin() {
  if (pin.length < 4) return;
  var pinCode = pin;
  sb.rpc('rpc_login_chauffeur', { p_pincode: pinCode })
    .then(function(result) {
      var rows = result.data;
      if (result.error || !rows || !rows.length) {
        document.getElementById('loginError').style.display = 'block';
        pin = '';
        updatePinDisplay();
        setTimeout(function() {
          document.getElementById('loginError').style.display = 'none';
        }, 2500);
        return;
      }
      gebruiker = rows[0];
      document.getElementById('loginError').style.display = 'none';
      pasBrandingToe(gebruiker);
      laadVoertuigen();
    });
}

function pasBrandingToe(bedrijf) {
  // Kleuren zijn vast (zelfde standaardstijl als het portaal) -- enkel het
  // logo blijft per bedrijf instelbaar, zie de bijhorende beslissing daar.
  var logoSrc = bedrijf.logo_url || 'Logo-PrevX.png';
  document.querySelectorAll('.app-logo-img').forEach(function(img) {
    img.src = logoSrc;
  });
}

function pincodeVergeten() {
  var naam = prompt('Je naam (exact zoals bekend bij PrevX):');
  if (!naam) return;
  var email = prompt('Je e-mailadres:');
  if (!email) return;
  sb.rpc('rpc_pincode_reset_aanvragen', { p_naam: naam, p_email: email })
    .then(function(result) {
      if (result.error) { showToast('Fout: ' + result.error.message); return; }
      showToast('Indien dit klopt, is er een code verstuurd — check je mailbox, of vraag je beheerder.');
      pincodeResetBevestigen(naam, email);
    });
}

function pincodeResetBevestigen(naam, email) {
  var code = prompt('Voer de ontvangen code in (of laat leeg om te annuleren):');
  if (!code) return;
  var nieuwe = prompt('Nieuwe pincode (4 cijfers):');
  if (!nieuwe) return;
  if (!/^\d{4}$/.test(nieuwe)) {
    showToast('Pincode moet exact 4 cijfers zijn.');
    return;
  }
  var bevestig = prompt('Herhaal de nieuwe pincode:');
  if (nieuwe !== bevestig) {
    showToast('Pincodes komen niet overeen.');
    return;
  }
  sb.rpc('rpc_pincode_reset_bevestigen', { p_naam: naam, p_email: email, p_code: code, p_nieuwe_pincode: nieuwe })
    .then(function(result) {
      if (result.error) { showToast('Fout: ' + result.error.message); return; }
      showToast('Pincode gereset! Je kan nu inloggen met je nieuwe pincode.');
    });
}

function wijzigPincode() {
  var huidige = prompt('Huidige pincode:');
  if (!huidige) return;
  var nieuwe = prompt('Nieuwe pincode (4 cijfers):');
  if (!nieuwe) return;
  if (!/^\d{4}$/.test(nieuwe)) {
    showToast('Pincode moet exact 4 cijfers zijn.');
    return;
  }
  var bevestig = prompt('Herhaal de nieuwe pincode:');
  if (nieuwe !== bevestig) {
    showToast('Pincodes komen niet overeen.');
    return;
  }
  sb.rpc('rpc_wijzig_pincode', { p_gebruiker_id: gebruiker.id, p_huidige_pincode: huidige, p_nieuwe_pincode: nieuwe })
    .then(function(result) {
      if (result.error) {
        showToast('Fout: ' + result.error.message);
        return;
      }
      showToast('Pincode gewijzigd!');
    });
}

        '<div class="voertuig-type">' + (v.type_naam || '') + '</div>' +
        '<div class="voertuig-omschrijving">' + (v.omschrijving || '') + '</div>';

      grid.appendChild(card);
    });

}

function kiesVoertuig(v) {
  voertuig = v;
  huidigeSectieIdx = 0;
  resultaten = {};
  gestartOp = new Date().toISOString();
  showScreen('inspectie');
  document.getElementById('headerUser2').innerHTML = '<strong>' + v.nummerplaat + '</strong>' + gebruiker.naam;
  document.getElementById('btnTerug').onclick = stapTerug;
  document.getElementById('btnVolgende').style.display = '';

  sb.rpc('rpc_checklist', { p_gebruiker_id: gebruiker.id, p_voertuig_id: v.id })
    .then(function(result) {
      var rijen = result.data || [];
      var bySectie = {};
      var volgorde = [];
      rijen.forEach(function(r) {
        if (!bySectie[r.sectie_id]) {
          bySectie[r.sectie_id] = { id: r.sectie_id, naam: r.sectie_naam, icon: r.sectie_icon, volgorde: r.sectie_volgorde, inspectie_punten: [] };
          volgorde.push(r.sectie_id);
        }
        bySectie[r.sectie_id].inspectie_punten.push({ id: r.punt_id, omschrijving: r.punt_omschrijving, volgorde: r.punt_volgorde, niveau: r.punt_niveau });
      });
      secties = volgorde.map(function(id) { return bySectie[id]; });
      if (!secties.length) {
        document.getElementById('stapTabs').innerHTML = '';
        document.getElementById('inspectieCard').innerHTML = '<div class="loading">Voor dit bedrijfsmiddel zijn nog geen checklistpunten ingesteld. Neem contact op met de beheerder.</div>';
        var btnTerug = document.getElementById('btnTerug');
        btnTerug.style.display = '';
        btnTerug.onclick = function() { laadVoertuigen(); };
        document.getElementById('btnVolgende').style.display = 'none';
        return;
      }
      secties.forEach(function(s) {
        s.inspectie_punten.forEach(function(p) {
          resultaten[p.id] = { status: null, opmerking: '', fotos: [], niveau: p.niveau };
        });
      });
      slaVoortgangOp();
      bouwTabs();
      toonSectie(0);
    });
}

function bouwTabs() {
  var tabs = document.getElementById('stapTabs');
  tabs.innerHTML = '';
  secties.forEach(function(s, i) {
    var btn = document.createElement('button');
    btn.className = 'stap-tab' + (i === 0 ? ' active' : '');
    btn.id = 'tab-' + i;
    btn.innerHTML = '<span class="stap-tab-icon">' + renderIcoon(resolveIcoonKey(s.icon), 13) + '</span>' + s.naam;
    btn.onclick = (function(idx) {
      return function() { huidigeSectieIdx = idx; toonSectie(idx); };
    })(i);
    tabs.appendChild(btn);
  });
}

function toonSectie(idx) {
  huidigeSectieIdx = idx;
  var s = secties[idx];
  updateTabs();
  updateProgress();

  var card = document.getElementById('inspectieCard');
  card.innerHTML = '<div class="sectie-header"><div class="sectie-icon">' + renderIcoon(resolveIcoonKey(s.icon), 20) + '</div>' +
    '<div><div class="sectie-naam">' + s.naam + '</div>' +
    '<div class="sectie-sub">' + s.inspectie_punten.length + ' punten</div></div></div>' +
    '<div class="check-list" id="checkList-' + s.id + '"></div>';

  var list = document.getElementById('checkList-' + s.id);
  s.inspectie_punten.forEach(function(p, i) {
    list.appendChild(bouwCheckItem(p, i));
  });

  document.getElementById('btnTerug').style.display = idx > 0 ? '' : 'none';
  document.getElementById('btnVolgende').innerHTML = idx < secties.length - 1 ? 'Volgende &#8594;' : 'Naar rapport &#8594;';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function bouwCheckItem(p, i) {
  var div = document.createElement('div');
  div.className = 'check-item';
  div.id = 'ci-' + p.id;
  var r = resultaten[p.id];
  var pid = p.id;
  var niveauBadge = p.niveau === 'informatief'
    ? '<span class="check-niveau informatief">Informatief</span>'
    : '<span class="check-niveau kritisch">Kritisch</span>';
  div.innerHTML = '<div class="check-top"><div class="check-num">' + (i + 1) + '</div>' +
    '<div class="check-label">' + p.omschrijving + niveauBadge + '</div></div>' +
    '<div class="check-btns">' +
    '<button class="btn-check ok' + (r.status === 'ok' ? ' sel' : '') + '" id="btn-ok-' + pid + '">JA</button>' +
    '<button class="btn-check nok' + (r.status === 'nok' ? ' sel' : '') + '" id="btn-nok-' + pid + '">NEE</button>' +
    '<button class="btn-check na' + (r.status === 'na' ? ' sel' : '') + '" id="btn-na-' + pid + '">NVT</button>' +
    '</div>' +
    '<div class="check-extras' + (r.status ? ' show' : '') + '" id="ex-' + pid + '">' +
    '<textarea class="opmerking" placeholder="Opmerking (optioneel)..." id="opm-' + pid + '">' + (r.opmerking || '') + '</textarea>' +
    '<label class="foto-btn">&#128247; Foto toevoegen<input type="file" accept="image/*" capture="environment" style="display:none" id="foto-input-' + pid + '"></label>' +
    '<div class="foto-row" id="fotos-' + pid + '"></div>' +
    '</div>';

  div.querySelector('#btn-ok-' + pid).onclick = function() { setStatus(pid, 'ok'); };
  div.querySelector('#btn-nok-' + pid).onclick = function() { setStatus(pid, 'nok'); };
  div.querySelector('#btn-na-' + pid).onclick = function() { setStatus(pid, 'na'); };
  div.querySelector('#opm-' + pid).oninput = function() { resultaten[pid].opmerking = this.value; slaVoortgangOp(); };
  div.querySelector('#foto-input-' + pid).onchange = function() { addFoto(pid, this); };

  renderFotos(pid);
  return div;
}

function setStatus(pid, status) {
  resultaten[pid].status = status;
  var item = document.getElementById('ci-' + pid);
  item.className = 'check-item ' + status;
  ['ok', 'nok', 'na'].forEach(function(s) {
    var btn = document.getElementById('btn-' + s + '-' + pid);
    if (btn) btn.classList.remove('sel');
  });
  var selBtn = document.getElementById('btn-' + status + '-' + pid);
  if (selBtn) selBtn.classList.add('sel');
  document.getElementById('ex-' + pid).classList.add('show');
  updateProgress();
  slaVoortgangOp();
}

var fotoUploadsBezig = 0;

function addFoto(pid, input) {
  var file = input.files[0];
  input.value = '';
  if (!file) return;
  var container = document.getElementById('fotos-' + pid);
  var placeholder = document.createElement('div');
  placeholder.className = 'foto-thumb';
  placeholder.innerHTML = '<div style="width:60px;height:60px;border-radius:6px;border:2px solid var(--gray-200);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--gray-500);text-align:center">Bezig...</div>';
  container.appendChild(placeholder);
  fotoUploadsBezig++;
  uploadInspectieMedia(file).then(function(res) {
    fotoUploadsBezig--;
    placeholder.remove();
    if (!res.ok) {
      console.error('Foto-upload mislukt:', res.status, res.body);
      showToast('Foto uploaden mislukt, probeer opnieuw.');
      return;
    }
    resultaten[pid].fotos.push(res.body.url);
    renderFotos(pid);
    slaVoortgangOp();
  }).catch(function(e) {
    fotoUploadsBezig--;
    placeholder.remove();
    console.error('Foto-upload exception:', e);
    showToast('Foto uploaden mislukt, probeer opnieuw.');
  });
}

function renderFotos(pid) {
  var c = document.getElementById('fotos-' + pid);
  if (!c) return;
  c.innerHTML = '';
  resultaten[pid].fotos.forEach(function(src, i) {
    var w = document.createElement('div');
    w.className = 'foto-thumb';
    var img = document.createElement('img');
    img.src = src;
    var btn = document.createElement('button');
    btn.className = 'foto-del';
    btn.textContent = 'x';
    btn.onclick = (function(p, idx) { return function() { delFoto(p, idx); }; })(pid, i);
    w.appendChild(img);
    w.appendChild(btn);
    c.appendChild(w);
  });
}

function delFoto(pid, i) {
  resultaten[pid].fotos.splice(i, 1);
  renderFotos(pid);
  slaVoortgangOp();
}

function updateProgress() {
  var total = Object.keys(resultaten).length;
  var done = Object.keys(resultaten).filter(function(k) { return resultaten[k].status; }).length;
  document.getElementById('progressFill').style.width = total ? (done / total * 100) + '%' : '0%';
}

function updateTabs() {
  secties.forEach(function(s, i) {
    var tab = document.getElementById('tab-' + i);
    if (!tab) return;
    var allDone = s.inspectie_punten.every(function(p) { return resultaten[p.id].status; });
    tab.className = 'stap-tab' + (i === huidigeSectieIdx ? ' active' : allDone ? ' done' : '');
  });
}

function stapTerug() {
  if (huidigeSectieIdx > 0) toonSectie(huidigeSectieIdx - 1);
}

function stapVolgende() {
  if (huidigeSectieIdx < secties.length - 1) {
    toonSectie(huidigeSectieIdx + 1);
  } else {
    bouwRapport();
    showScreen('rapport');
  }
}

function bouwRapport() {
  // Herstel de verzendknop naar zijn standaardtoestand -- na een geslaagde
  // verzending eerder in dezelfde sessie bleef hij anders verborgen/uitgevinkt
  // staan bij een volgende inspectie ("Nieuwe inspectie" start geen nieuwe
  // paginalading, dus de knop-state uit de vorige ronde bleef gewoon hangen).
  var btnVerzend = document.getElementById('btnVerzend');
  btnVerzend.style.display = '';
  btnVerzend.disabled = false;
  btnVerzend.textContent = 'Verzenden';
  document.getElementById('btnNieuw').style.display = 'none';

  document.getElementById('headerUser3').innerHTML = '<strong>' + gebruiker.naam + '</strong>' + voertuig.nummerplaat;
  var ok = 0, nok = 0, open = 0, nokKritisch = 0, nokInformatief = 0;
  Object.keys(resultaten).forEach(function(k) {
    var r = resultaten[k];
    if (r.status === 'ok') ok++;
    else if (r.status === 'nok') {
      nok++;
      if (r.niveau === 'informatief') nokInformatief++; else nokKritisch++;
    }
    else if (r.status === 'na') {}
    else open++;
  });
  document.getElementById('sOk').textContent = ok;
  document.getElementById('sNok').textContent = nok;
  document.getElementById('sOpen').textContent = open;

  var vbox = document.getElementById('verdictBox');
  if (open > 0) {
    vbox.innerHTML = '<div class="verdict-box open">Onvolledig - ' + open + ' punt(en) open</div>';
  } else if (nokKritisch > 0) {
    vbox.innerHTML = '<div class="verdict-box nogo">NIET RIJKLAAR - ' + nokKritisch + ' kritiek punt(en) NOK</div>';
  } else if (nokInformatief > 0) {
    vbox.innerHTML = '<div class="verdict-box warn">RIJKLAAR MET OPMERKINGEN - ' + nokInformatief + ' informatief punt(en) NOK</div>';
  } else {
    vbox.innerHTML = '<div class="verdict-box go">RIJKLAAR - Alle ' + ok + ' punten in orde</div>';
  }

  var lijst = document.getElementById('rapportLijst');
  lijst.innerHTML = '';
  secties.forEach(function(s) {
    var sec = document.createElement('div');
    sec.className = 'rapport-sectie';
    var header = document.createElement('div');
    header.className = 'rapport-sectie-header';
    header.innerHTML = '<span class="rapport-sectie-icon">' + renderIcoon(resolveIcoonKey(s.icon), 14) + '</span><span>' + s.naam + '</span>';
    sec.appendChild(header);
    s.inspectie_punten.forEach(function(p) {
      var r = resultaten[p.id];
      var st = r.status || 'open';
      var labels = { ok: 'JA', nok: 'NEE', na: 'NVT', open: '-' };
      var rij = document.createElement('div');
      rij.className = 'rapport-rij';
      rij.innerHTML = '<span class="rapport-badge ' + st + '">' + (labels[st] || '-') + '</span>' +
        '<div class="rapport-tekst">' + p.omschrijving +
        (r.opmerking ? '<div class="rapport-note">' + r.opmerking + '</div>' : '') +
        '</div>';
      sec.appendChild(rij);
    });
    lijst.appendChild(sec);
  });

  initSig();
}

function initSig() {
  var canvas = document.getElementById('sigCanvas');
  canvas.width = canvas.parentElement.offsetWidth || 500;
  canvas.height = 150;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = '#003366';
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  sigHasSig = false;

  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var sx = canvas.width / r.width;
    var sy = canvas.height / r.height;
    if (e.touches) {
      return { x: (e.touches[0].clientX - r.left) * sx, y: (e.touches[0].clientY - r.top) * sy };
    }
    return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
  }

  canvas.onmousedown = function(e) { sigDrawing = true; var p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  canvas.onmousemove = function(e) { if (!sigDrawing) return; var p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); markSig(); };
  canvas.onmouseup = function() { sigDrawing = false; };
  canvas.onmouseleave = function() { sigDrawing = false; };
  canvas.ontouchstart = function(e) { e.preventDefault(); sigDrawing = true; var p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  canvas.ontouchmove = function(e) { e.preventDefault(); if (!sigDrawing) return; var p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); markSig(); };
  canvas.ontouchend = function() { sigDrawing = false; };
}

function markSig() {
  sigHasSig = true;
  document.getElementById('sigPlaceholder').style.display = 'none';
}

function clearSig() {
  var c = document.getElementById('sigCanvas');
  sigCtx.clearRect(0, 0, c.width, c.height);
  sigHasSig = false;
  document.getElementById('sigPlaceholder').style.display = '';
}

function uploadInspectieMedia(file, bestandsnaam) {
  var form = new FormData();
  form.append('gebruiker_id', gebruiker.id);
  form.append('file', file, bestandsnaam || file.name);
  return fetch(SUPABASE_URL + '/functions/v1/upload-inspectie-media', {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY },
    body: form
  }).then(function(resp) {
    return resp.json().then(function(body) { return { ok: resp.ok, status: resp.status, body: body }; });
  });
}

function verzendRapport() {
  if (fotoUploadsBezig > 0) {
    showToast('Even geduld, er wordt nog een foto geüpload...');
    return;
  }
  var btn = document.getElementById('btnVerzend');
  btn.disabled = true;
  btn.textContent = 'Bezig...';

  var nokKritisch = 0, nokInformatief = 0, open = 0;
  Object.keys(resultaten).forEach(function(k) {
    var r = resultaten[k];
    if (r.status === 'nok') {
      if (r.niveau === 'informatief') nokInformatief++; else nokKritisch++;
    } else if (!r.status) open++;
  });

  var verdict = open > 0 ? 'onvolledig'
    : nokKritisch > 0 ? 'niet_rijklaar'
    : nokInformatief > 0 ? 'rijklaar_met_opmerkingen'
    : 'rijklaar';

  var handtekeningKlaar = Promise.resolve(null);
  if (sigHasSig) {
    handtekeningKlaar = new Promise(function(resolve) {
      document.getElementById('sigCanvas').toBlob(function(blob) {
        uploadInspectieMedia(blob, 'handtekening.png').then(function(res) {
          resolve(res.ok ? res.body.url : null);
        }).catch(function() { resolve(null); });
      }, 'image/png');
    });
  }

  handtekeningKlaar.then(function(handtekening) {
    var punten = [];
    secties.forEach(function(s) {
      s.inspectie_punten.forEach(function(p) {
        var r = resultaten[p.id];
        punten.push({
          punt_id: p.id,
          status: r.status || 'open',
          opmerking: r.opmerking || null,
          fotos: r.fotos
        });
      });
    });

    return sb.rpc('rpc_verzend_inspectie', {
      p_gebruiker_id: gebruiker.id,
      p_voertuig_id: voertuig.id,
      p_verdict: verdict,
      p_handtekening: handtekening,
      p_resultaten: punten,
      p_gestart_op: gestartOp
    });
  }).then(function(result) {
    if (result.error) throw result.error;
    wisVoortgang();
    showToast('Rapport verzonden!');
    btn.textContent = 'Verzonden';
    document.getElementById('btnNieuw').style.display = '';
    btn.style.display = 'none';
  }).catch(function(e) {
    console.error(e);
    showToast('Fout: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Verzenden';
  });
}

function nieuweInspectie() {
  wisVoortgang();
  pin = '';
  updatePinDisplay();
  gebruiker = null;
  voertuig = null;
  secties = [];
  resultaten = {};
  gestartOp = null;
  showScreen('login');
}

function showScreen(naam) {
  var schermen = document.querySelectorAll('.screen');
  for (var i = 0; i < schermen.length; i++) {
    schermen[i].classList.remove('active');
  }
  document.getElementById('screen-' + naam).classList.add('active');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}
</script>
