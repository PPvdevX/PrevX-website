<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Mijn PrevX</title>
</head>
<body>
<p style="font-family:sans-serif;padding:24px">Deze pagina is verhuisd naar <a id="doel" href="/account">prevx.be/account</a>.</p>
<script>
// Het portaal staat sinds augustus 2026 op /account. Deze pagina blijft bestaan
// voor bladwijzers en voor herstelmails die vóór de verhuizing verstuurd zijn.
//
// Zoekterm en fragment moeten mee: Supabase zet het herstel-token achter een #
// in de URL. Vergeet je dat, dan komt iemand op /account terecht zonder token
// en krijgt hij een inlogscherm in plaats van "kies een nieuw wachtwoord" --
// zonder dat er iets fout lijkt te gaan.
var doel = '/account' + location.search + location.hash;
document.getElementById('doel').setAttribute('href', doel);
location.replace(doel);
</script>
</body>
</html>
